services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html
        expose:
            - "9000"
        networks:
            - transfer-network
        depends_on:
            - mysql

    nginx:
        image: nginx:latest
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - transfer-network
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: money-transfer-management
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        expose:
            - "3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - transfer-network

volumes:
    mysql-data:

networks:
    transfer-network:
