services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: transfer-app
        restart: unless-stopped
        working_dir: /var/www/html
        expose:
            - "9000"
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - transfer-network

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        container_name: transfer-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        depends_on:
            app:
                condition: service_started
        networks:
            - transfer-network

    mysql:
        image: mysql:8.4
        container_name: transfer-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: money-transfer-management
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        expose:
            - "3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - transfer-network

volumes:
    mysql-data:

networks:
    transfer-network:
        driver: bridge
